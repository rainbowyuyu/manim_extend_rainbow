// =============================================================================
// CS2 · C4 爆炸电影感录屏配置
// 用法：map de_mirage → exec record_explosion_cinematic
// 复制到：.../Counter-Strike Global Offensive/game/csgo/cfg/
// 建议：本地服 / -insecure / 练习模式；OBS 1920×1080 60fps
// =============================================================================

echo "=== CS2 Explosion Cinematic Recording ==="

// ── 1. 服务器基础 ─────────────────────────────────────────────────────────
sv_cheats 1
mp_warmup_end
mp_freezetime 3
mp_roundtime 60
mp_roundtime_defuse 60
mp_buy_anywhere 1
mp_buytime 9999
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_plant_c4_anywhere 1
mp_c4timer 15
mp_afterroundmoney 16000
mp_restartgame 1

bot_kick all

// A 点伤害场（录冲击波时可开；纯爆炸特写可 cine_debug_off）
cl_bake_bomb_damage_debug 1

// ── 2. 画质 · 粒子 · 后期（爆炸更「炸」）──────────────────────────────────
// 粒子与特效（勿关 r_drawparticles）
r_drawparticles 1
r_drawdecals 1
r_drawdetailprops 1
r_dynamic 1

// Bloom 开着：爆炸火球边缘更亮（mat_disable_bloom 0 = 启用）
mat_disable_bloom 0

// HDR 自动曝光：爆炸瞬间会自然压暗环境、高光更突出（0 = 自动）
mat_force_tonemap_scale 0
mat_tonemap_force_scale 0

// 可选：略提亮场景底亮度，爆炸对比更强（不满意就 exec cine_glow_reset）
// mat_tonemap_force_scale 1.15

// 关闭多余 UI / 调试信息
cl_showfps 0
cl_showpos 0
net_graph 0
gameinstructor_enable 0
cl_autohelp 0
cl_showhelp 0
cl_drawhud 1
r_drawviewmodel 1

// 声音：压低音乐、保留爆炸 SFX（可按喜好改）
snd_musicvolume 0.15
volume 0.85

// 录制帧率：本地录 OBS 时可解帧率上限
fps_max 0

// ── 3. 镜头默认（第一人称 · 低抖动）────────────────────────────────────
fov_cs_debug 90
viewmodel_fov 68
viewmodel_offset_x 0
viewmodel_offset_y 0
viewmodel_offset_z 0
cl_bob_lower_amt 0
cl_bobamt_lat 0
cl_bobamt_vert 0
cl_crosshair 0

// ── 4. 别名：一键电影模式 ─────────────────────────────────────────────────
alias "cine_on" "cine_hud_off; cine_glow_on; cine_cam_fp; echo >>> Cinematic ON — F6 HUD | F7 慢动作 | F8 超慢 | F9 正常速度"
alias "cine_off" "cine_hud_on; cine_glow_reset; cine_normal; cine_cam_fp; echo >>> Cinematic OFF"

alias "cine_hud_off" "cl_drawhud 0; r_drawviewmodel 0; cl_crosshair 0; con_filter_enable 1; con_filter_text HIDE"
alias "cine_hud_on" "cl_drawhud 1; r_drawviewmodel 1; cl_crosshair 1; con_filter_enable 0"

alias "cine_glow_on" "mat_disable_bloom 0; mat_force_tonemap_scale 0; mat_tonemap_force_scale 1.12; r_drawparticles 1"
alias "cine_glow_reset" "mat_disable_bloom 0; mat_force_tonemap_scale 0; mat_tonemap_force_scale 0"

alias "cine_slow" "host_timescale 0.35; echo >>> Slow-mo 35% — 冲击波蔓延更清晰"
alias "cine_ultraslow" "host_timescale 0.15; echo >>> Ultra slow 15% — 适合单帧感特写"
alias "cine_normal" "host_timescale 1; echo >>> Normal speed"

// 自由运镜 / 第三人称 / 回第一人称
alias "cine_cam_free" "noclip; echo >>> Noclip — WASD 移动，鼠标转向，再按一次 noclip 退出"
alias "cine_cam_tp" "thirdperson; thirdpersondist 120; thirdpersonoffset 0 20 0; echo >>> Third person — 适合环视爆炸"
alias "cine_cam_fp" "firstperson; echo >>> First person"

// 景深（部分驱动/地图有效；无效可忽略）
alias "cine_dof_on" "r_dof_override 1; r_dof_nearblur 4; r_dof_farblur 8; echo >>> DOF on"
alias "cine_dof_off" "r_dof_override 0; echo >>> DOF off"

// 下包前定格：方便摆 OBS 机位
alias "cine_freeze" "bot_stop 1; host_timescale 0; echo >>> FROZEN — 摆机位后 exec cine_unfreeze"
alias "cine_unfreeze" "bot_stop 0; host_timescale 1; echo >>> Unfrozen"

// Debug 热力图开关
alias "cine_debug_a" "cl_bake_bomb_damage_debug 1; echo >>> Debug overlay Site A"
alias "cine_debug_b" "cl_bake_bomb_damage_debug 2; echo >>> Debug overlay Site B"
alias "cine_debug_off" "cl_bake_bomb_damage_debug 0; echo >>> Debug overlay OFF — 纯爆炸画面"

// 快速重包重录
alias "cine_retry" "mp_restartgame 1; cine_normal; echo >>> Round restart — 重新下包录制"

// ── 5. 键位（可按习惯改）──────────────────────────────────────────────────
bind "F5" "cine_on"
bind "F6" "cine_hud_off"
bind "F7" "cine_slow"
bind "F8" "cine_ultraslow"
bind "F9" "cine_normal"
bind "F10" "cine_cam_tp"
bind "F11" "cine_cam_free"
bind "F12" "cine_cam_fp"

// ── 6. 推荐录爆炸流程 ─────────────────────────────────────────────────────
echo ""
echo "推荐流程："
echo "  1) 走到机位 → bind 键或 exec cine_freeze 摆镜头"
echo "  2) exec cine_unfreeze → exec cine_on → F7 慢动作"
echo "  3) 下包 → 等爆炸；纯火球特写：exec cine_debug_off"
echo "  4) 环视冲击波：F10 第三人称 + F7 慢动作"
echo "  5) 录完 exec cine_off"
echo ""
echo "快捷键：F5 全开 | F6 隐HUD | F7/F8 慢动作 | F9 常速 | F10/F11/F12 镜头"
echo "=== Ready for cinematic C4 recording ==="
